<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic Flow - Interactive Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-orange': '#ff5500',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse {
      0%, 100% { transform: scaleY(0.7); opacity: 0.8; }
      50% { transform: scaleY(1.4); opacity: 1; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
      50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slide-in-right {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    @keyframes fade-in-scale {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    .animate-bounce { animation: bounce 1s infinite; }
    .animate-slide-in-right { animation: slide-in-right 0.3s ease-out; }
    .animate-fade-in-scale { animation: fade-in-scale 0.2s ease-out; }
    .tab-enter { animation: fade-in 0.25s ease-out; }

    .scrollbar-thin::-webkit-scrollbar { width: 5px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 9999px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #ff5500; }

    input[type=range].accent-brand-orange::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #ff5500;
      cursor: pointer;
    }
    input[type=range].accent-brand-orange::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #ff5500;
      cursor: pointer;
      border: none;
    }
    input[type=range].accent-brand-orange {
      accent-color: #ff5500;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: #f0f0f0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ─── Helper: Create Lucide icon as React element ───────────────────────────
    function Icon({ name, className, style }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconData = window.lucide[name];
          if (iconData) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            const [defaultAttrs, ...children] = iconData;
            Object.entries({ ...defaultAttrs, class: className || '', style: '' }).forEach(([k, v]) => {
              if (k !== 'style') svg.setAttribute(k, v);
            });
            if (style) Object.assign(svg.style, style);
            children.forEach(([tag, attrs]) => {
              const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
              Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
              svg.appendChild(el);
            });
            ref.current.appendChild(svg);
          }
        }
      }, [name, className]);
      return React.createElement('span', { ref, style: { display: 'inline-flex', alignItems: 'center' } });
    }

        Heart: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${className.includes('fill-current') ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
        Eye: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,

        Plus: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
        Compass: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`,
        TrendingUp: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
        UserPlus: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>`,
        UserCheck: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>`,

        Send: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,

        X: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,

    // ─── SynthwaveEngine ────────────────────────────────────────────────────────
    class SynthwaveEngine {
      constructor(tempo = 112, duration = 225) {
        this.audioCtx = null;
        this.masterVolumeNode = null;
        this.analyserNode = null;
        this.isRunning = false;
        this.nextNoteTime = 0.0;
        this.stepIndex = 0;
        this.tempo = tempo;
        this.timerId = null;
        this.onStepCallback = null;
        this.onTimeUpdateCallback = null;
        this.currentPlaytime = 0;
        this.lastSystemTime = 0;
        this.totalDuration = duration;
        this.intervalTimer = null;
      }
      init() {
        if (this.audioCtx) return;
        const AudioContextClass = (window.AudioContext || window.webkitAudioContext);
        this.audioCtx = new AudioContextClass();
        this.masterVolumeNode = this.audioCtx.createGain();
        this.masterVolumeNode.gain.value = 0.5;
        this.analyserNode = this.audioCtx.createAnalyser();
        this.analyserNode.fftSize = 256;
        this.masterVolumeNode.connect(this.analyserNode);
        this.analyserNode.connect(this.audioCtx.destination);
      }
      registerCallbacks(onStep, onTimeUpdate) {
        this.onStepCallback = onStep;
        this.onTimeUpdateCallback = onTimeUpdate;
      }
      setVolume(volume) {
        if (this.masterVolumeNode) this.masterVolumeNode.gain.value = volume;
      }
      setTime(timeInSeconds) {
        this.currentPlaytime = Math.max(0, Math.min(this.totalDuration, timeInSeconds));
        if (this.onTimeUpdateCallback) this.onTimeUpdateCallback(this.currentPlaytime);
      }
      getAnalyser() { return this.analyserNode; }
      start(startTime) {
        this.init();
        if (!this.audioCtx) return;
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        this.isRunning = true;
        this.currentPlaytime = startTime;
        this.lastSystemTime = Date.now();
        this.nextNoteTime = this.audioCtx.currentTime;
        this.stepIndex = 0;
        this.schedulerLoop();
        this.intervalTimer = setInterval(() => {
          if (!this.isRunning) return;
          const now = Date.now();
          const delta = (now - this.lastSystemTime) / 1000;
          this.lastSystemTime = now;
          this.currentPlaytime += delta;
          if (this.currentPlaytime >= this.totalDuration) this.currentPlaytime = 0;
          if (this.onTimeUpdateCallback) this.onTimeUpdateCallback(this.currentPlaytime);
        }, 100);
      }
      stop() {
        this.isRunning = false;
        if (this.timerId) { clearTimeout(this.timerId); this.timerId = null; }
        if (this.intervalTimer) { clearInterval(this.intervalTimer); this.intervalTimer = null; }
      }
      schedulerLoop() {
        if (!this.isRunning || !this.audioCtx) return;
        const scheduleAheadTime = 0.1;
        while (this.nextNoteTime < this.audioCtx.currentTime + scheduleAheadTime) {
          this.scheduleNote(this.stepIndex, this.nextNoteTime);
          this.advanceNote();
        }
        this.timerId = setTimeout(() => this.schedulerLoop(), 25);
      }
      advanceNote() {
        const secondsPerBeat = 60.0 / this.tempo;
        const secondsPerStep = secondsPerBeat / 4;
        this.nextNoteTime += secondsPerStep;
        this.stepIndex = (this.stepIndex + 1) % 16;
      }
      scheduleNote(step, time) {
        if (!this.audioCtx || !this.masterVolumeNode) return;
        if (this.onStepCallback) this.onStepCallback(step);
        if (step % 4 === 0) this.playKick(time);
        if (step === 4 || step === 12) this.playSnare(time);
        this.playBassline(step, time);
        this.playLeadArp(step, time);
      }
      playKick(time) {
        if (!this.audioCtx || !this.masterVolumeNode) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.connect(gain); gain.connect(this.masterVolumeNode);
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.12);
        gain.gain.setValueAtTime(0.8, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
        osc.start(time); osc.stop(time + 0.15);
      }
      playSnare(time) {
        if (!this.audioCtx || !this.masterVolumeNode) return;
        const bufferSize = this.audioCtx.sampleRate * 0.15;
        const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noiseSource = this.audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        const noiseFilter = this.audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass'; noiseFilter.frequency.value = 1000;
        const noiseGain = this.audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.4, time);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
        noiseSource.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(this.masterVolumeNode);
        const osc = this.audioCtx.createOscillator();
        const oscGain = this.audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(180, time);
        oscGain.gain.setValueAtTime(0.3, time);
        oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
        osc.connect(oscGain); oscGain.connect(this.masterVolumeNode);
        noiseSource.start(time); noiseSource.stop(time + 0.15);
        osc.start(time); osc.stop(time + 0.15);
      }
      playBassline(step, time) {
        if (!this.audioCtx || !this.masterVolumeNode) return;
        const chordIdx = Math.floor(this.currentPlaytime / 4) % 4;
        const baseFreqs = [55.00, 65.41, 49.00, 43.65];
        const baseFreq = baseFreqs[chordIdx];
        const freq = (step % 2 === 1) ? baseFreq * 2 : baseFreq;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        const filter = this.audioCtx.createBiquadFilter();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, time);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(250, time);
        filter.frequency.exponentialRampToValueAtTime(600, time + 0.05);
        filter.frequency.exponentialRampToValueAtTime(200, time + 0.1);
        gain.gain.setValueAtTime(0.3, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
        osc.connect(filter); filter.connect(gain); gain.connect(this.masterVolumeNode);
        osc.start(time); osc.stop(time + 0.12);
      }
      playLeadArp(step, time) {
        if (!this.audioCtx || !this.masterVolumeNode) return;
        const pattern = [0, 2, 4, 6, 8, 10, 12, 14];
        if (!pattern.includes(step)) return;
        const chordIdx = Math.floor(this.currentPlaytime / 4) % 4;
        const progressions = [
          [220.00, 261.63, 329.63, 392.00],
          [261.63, 329.63, 392.00, 523.25],
          [196.00, 246.94, 293.66, 392.00],
          [174.61, 220.00, 261.63, 349.23]
        ];
        const notes = progressions[chordIdx];
        const subStep = Math.floor(step / 2) % notes.length;
        const noteFreq = notes[subStep] * 2;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        const delay = this.audioCtx.createDelay();
        const delayGain = this.audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(noteFreq, time);
        const lfo = this.audioCtx.createOscillator();
        const lfoGain = this.audioCtx.createGain();
        lfo.frequency.value = 6; lfoGain.gain.value = 5;
        lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
        gain.gain.setValueAtTime(0.18, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.18);
        delay.delayTime.value = 0.15; delayGain.gain.value = 0.3;
        osc.connect(gain); gain.connect(this.masterVolumeNode);
        gain.connect(delay); delay.connect(delayGain);
        delayGain.connect(this.masterVolumeNode); delayGain.connect(delay);
        lfo.start(time); osc.start(time);
        lfo.stop(time + 0.2); osc.stop(time + 0.2);
      }
    }

    // ─── Helper ──────────────────────────────────────────────────────────────────
    function formatTime(secs) {
      const minutes = Math.floor(secs / 60);
      const seconds = Math.floor(secs % 60);
      return `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    // ─── Waveform Component ──────────────────────────────────────────────────────
    function Waveform({ track, currentTime, comments, activeFilter, onSeek, onSelectComment, selectedComment }) {
      const containerRef = useRef(null);
      const barCount = 70;

      const barHeights = useMemo(() => {
        const heights = [];
        for (let i = 0; i < barCount; i++) {
          const baseSin = Math.sin(i * 0.22) * 16;
          const pseudoRand = ((i * 17) % 23) - 10;
          const h = Math.max(8, 25 + baseSin + pseudoRand);
          heights.push(h);
        }
        return heights;
      }, []);

      const progressPercent = useMemo(() => {
        if (!track.duration) return 0;
        return (currentTime / track.duration) * 100;
      }, [currentTime, track.duration]);

      const handleTimelineClick = (e) => {
        if (!containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const pct = Math.max(0, Math.min(100, (clickX / rect.width) * 100));
        const targetSeconds = (pct / 100) * track.duration;
        onSeek(targetSeconds);
      };

      const filteredComments = useMemo(() =>
        comments.filter((c) => c.trackId === track.id && c.type === activeFilter),
        [comments, track.id, activeFilter]
      );

      return (
        <div className="relative mb-8 pt-4 pb-2">
          <div
            ref={containerRef}
            onClick={handleTimelineClick}
            className="relative h-20 flex items-end cursor-pointer"
          >
            {/* Background bars */}
            <div className="flex items-end justify-between w-full h-full pb-2 opacity-25 select-none pointer-events-none">
              {barHeights.map((h, i) => (
                <div key={`bg-${i}`} className="bg-neutral-800 rounded-sm" style={{ width: '3px', height: `${h}px`, margin: '0 1.5px' }} />
              ))}
            </div>
            {/* Active orange bars */}
            <div
              className="absolute left-0 bottom-0 top-0 overflow-hidden flex items-end pointer-events-none"
              style={{ width: `${progressPercent}%`, transition: 'width 0.1s linear' }}
            >
              <div className="flex items-end justify-between h-full pb-2" style={{ minWidth: '100vw' }}>
                {barHeights.map((h, i) => (
                  <div key={`active-${i}`} className="rounded-sm" style={{ width: '3px', height: `${h}px`, margin: '0 1.5px', backgroundColor: '#ff5500', boxShadow: '0 0 8px rgba(255,85,0,0.4)' }} />
                ))}
              </div>
            </div>
            {/* Comment markers */}
            <div className="absolute inset-x-0 top-0 bottom-2 pointer-events-none">
              {filteredComments.map((comment) => {
                const commentPosPct = (comment.time / track.duration) * 100;
                const isSelected = selectedComment?.id === comment.id;
                return (
                  <div
                    key={comment.id}
                    className="absolute rounded-full border-2 border-white bg-white shadow-md cursor-pointer pointer-events-auto select-none"
                    style={{
                      width: '32px', height: '32px',
                      left: `${commentPosPct}%`,
                      bottom: '8px',
                      zIndex: isSelected ? 40 : 20,
                      transform: `translateX(-50%) scale(${isSelected ? 1.2 : 1})`,
                      transition: 'transform 0.2s'
                    }}
                    onClick={(e) => { e.stopPropagation(); onSelectComment(isSelected ? null : comment); }}
                  >
                    <img src={comment.avatar} alt={comment.name} referrerPolicy="no-referrer" className="w-full h-full rounded-full object-cover" />
                    {comment.type === 'artist' && (
                      <div className="absolute rounded-full border border-white flex items-center justify-center" style={{ bottom: '-4px', right: '-4px', width: '14px', height: '14px', backgroundColor: '#ff5500' }}>
                        <svg className="fill-white" width="8" height="8" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z" /></svg>
                      </div>
                    )}
                    {comment.likes >= 1000 && (
                      <div className="absolute text-white font-bold border border-white rounded" style={{ top: '-6px', right: '-8px', fontSize: '8px', padding: '1px 3px', backgroundColor: '#ff5500' }}>
                        {(comment.likes / 1000).toFixed(1)}k
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
          {/* Floating comment popup */}
          {selectedComment && (
            <div
              className="absolute bg-white border border-neutral-200 p-3 rounded-xl shadow-xl flex flex-col gap-1 animate-fade-in-scale"
              style={{
                left: `${Math.min(Math.max((selectedComment.time / track.duration) * 100, 20), 75)}%`,
                top: '-90px',
                zIndex: 50,
                width: '240px',
                transform: 'translateX(-50%)'
              }}
            >
              <div className="flex items-center gap-2 mb-1">
                <img className="w-8 h-8 rounded-full border border-neutral-200 object-cover" src={selectedComment.avatar} alt={selectedComment.name} referrerPolicy="no-referrer" />
                <div>
                  <p className="font-semibold text-xs text-neutral-800 leading-tight">{selectedComment.name}</p>
                  <p className="text-neutral-500" style={{ fontSize: '10px' }}>at {selectedComment.timestampText}</p>
                </div>
                <button onClick={() => onSelectComment(null)} className="ml-auto text-neutral-400 hover:text-neutral-600 cursor-pointer p-0.5">
                  <LucideIcon name="X" size={12} />
                </button>
              </div>
              <p className="text-xs text-neutral-700 leading-relaxed text-left">{selectedComment.text}</p>
              <div className="absolute w-4 h-4 bg-white border-r border-b border-neutral-200 rotate-45" style={{ bottom: '-8px', left: '50%', transform: 'translateX(-50%) rotate(45deg)', zIndex: 40 }} />
            </div>
          )}
        </div>
      );
    }

    // ─── CommentsPanel Component ─────────────────────────────────────────────────
    function CommentsPanel({ track, currentTime, comments, activeFilter, onAddComment, onLikeComment, onSelectComment }) {
      const [newCommentText, setNewCommentText] = useState('');
      const [isFocused, setIsFocused] = useState(false);

      const filteredComments = comments.filter(c => c.trackId === track.id && c.type === activeFilter);

      const handleSendComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        onAddComment(newCommentText.trim(), Math.floor(currentTime));
        setNewCommentText('');
      };

      return (
        <div className="flex flex-col flex-1 mt-4 border border-neutral-100 rounded-xl bg-white p-4 shadow-sm text-left">
          <div className="flex justify-between items-center mb-3 pb-2 border-b border-neutral-100">
            <h3 className="font-semibold text-sm text-neutral-800 flex items-center gap-1.5">
              <LucideIcon name="MessageSquare" size={16} color="#ff5500" />
              {activeFilter === 'artist' ? 'Creator Commentary' : activeFilter === 'top' ? 'Popular Feedbacks' : 'Friend Activities'} ({filteredComments.length})
            </h3>
            <p className="font-mono text-neutral-500" style={{ fontSize: '10px' }}>Marker Sync: {formatTime(currentTime)}</p>
          </div>
          {/* Add comment form */}
          <form onSubmit={handleSendComment} className="relative mb-4">
            <div className="flex gap-2">
              <textarea
                value={newCommentText}
                onChange={(e) => setNewCommentText(e.target.value)}
                onFocus={() => setIsFocused(true)}
                placeholder={`Say something at ${formatTime(currentTime)}...`}
                rows={isFocused ? 2 : 1}
                className="flex-1 text-xs p-2.5 bg-neutral-50 text-neutral-800 rounded-lg border border-neutral-200 outline-none transition-all resize-none"
                style={{ transition: 'border-color 0.2s' }}
                onMouseEnter={e => e.target.style.borderColor = '#ff5500'}
                onMouseLeave={e => !isFocused && (e.target.style.borderColor = '#e5e7eb')}
              />
              <button
                type="submit"
                disabled={!newCommentText.trim()}
                className="px-3 text-white rounded-lg flex items-center justify-center transition-all active:scale-95 cursor-pointer self-end h-9"
                style={{ backgroundColor: newCommentText.trim() ? '#ff5500' : '#ffb599', pointerEvents: newCommentText.trim() ? 'auto' : 'none' }}
              >
                <LucideIcon name="Send" size={14} color="white" />
              </button>
            </div>
            {isFocused && (
              <div className="flex justify-between items-center mt-1" style={{ fontSize: '10px' }}>
                <span className="text-neutral-500">Your comment will stick to timestamp {formatTime(currentTime)}</span>
                <button type="button" onClick={() => setIsFocused(false)} className="text-neutral-400 hover:text-neutral-600 cursor-pointer">Minimize</button>
              </div>
            )}
          </form>
          {/* Comments list */}
          <div className="space-y-3 overflow-y-auto scrollbar-thin" style={{ maxHeight: '300px', paddingRight: '6px' }}>
            {filteredComments.length === 0 ? (
              <div className="text-center py-6">
                <p className="text-xs text-neutral-400">No comments tagged under this section yet.</p>
                <p className="text-neutral-400 mt-1" style={{ fontSize: '10px' }}>Be the first to add a comment at {formatTime(currentTime)}!</p>
              </div>
            ) : (
              [...filteredComments].sort((a, b) => b.likes - a.likes).map(c => (
                <div
                  key={c.id}
                  className="flex gap-2.5 items-start bg-neutral-50 hover:bg-neutral-100 p-2.5 rounded-lg border border-neutral-100 transition-colors cursor-pointer"
                  onClick={() => onSelectComment(c)}
                >
                  <img src={c.avatar} alt={c.name} referrerPolicy="no-referrer" className="rounded-full border border-neutral-200 object-cover mt-0.5" style={{ width: '32px', height: '32px', flexShrink: 0 }} />
                  <div className="flex-1 min-w-0">
                    <div className="flex justify-between items-baseline">
                      <span className="text-xs font-semibold text-neutral-800 flex items-center gap-1 leading-snug">
                        {c.name}
                        {c.type === 'artist' && (
                          <span className="text-white rounded-full font-medium" style={{ backgroundColor: '#ff5500', fontSize: '8px', padding: '1px 4px' }}>Artist</span>
                        )}
                      </span>
                      <span
                        className="font-semibold font-mono rounded hover:bg-orange-100 transition-all"
                        style={{ fontSize: '10px', color: '#ff5500', backgroundColor: '#fff7f5', padding: '1px 4px' }}
                        onClick={(e) => { e.stopPropagation(); onSelectComment(c); }}
                      >
                        {formatTime(c.time)}
                      </span>
                    </div>
                    <p className="text-xs text-neutral-600 mt-1 leading-relaxed break-words text-left">{c.text}</p>
                    <div className="flex items-center gap-3 mt-2 text-neutral-500" style={{ fontSize: '10px' }}>
                      <button
                        onClick={(e) => { e.stopPropagation(); onLikeComment(c.id); }}
                        className="flex items-center gap-1 cursor-pointer transition-colors"
                        style={{ color: c.likedByCurrentUser ? '#ff5500' : undefined }}
                      >
                        <LucideIcon name="Heart" size={14} className={c.likedByCurrentUser ? 'fill-current' : ''} color={c.likedByCurrentUser ? '#ff5500' : '#9ca3af'} />
                        <span>{c.likes} likes</span>
                      </button>
                      <span>•</span>
                      <button onClick={(e) => { e.stopPropagation(); setNewCommentText(`@${c.name} `); setIsFocused(true); }} className="hover:text-neutral-700 cursor-pointer">Reply</button>
                    </div>
                  </div>
                </div>
              ))
            )}
          </div>

      );

    // ─── PlaylistDrawer Component ────────────────────────────────────────────────

            </div>
          </div>
        </div>
      );
    }

    // ─── Main App Component ──────────────────────────────────────────────────────
    function App() {
      const [activeTab, setActiveTab] = useState('library');
      const [isPlaylistOpen, setIsPlaylistOpen] = useState(false);
      const [currentTrack, setCurrentTrack] = useState(TRACKS[0]);
      const [comments, setComments] = useState(INITIAL_COMMENTS);
      const [activeFilter, setActiveFilter] = useState('artist');
      const [selectedComment, setSelectedComment] = useState(null);
      const [playerState, setPlayerState] = useState({ isPlaying: false, currentTime: 0, volume: 0.6, isMuted: false, isLooping: false, isShuffled: false });
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedGenre, setSelectedGenre] = useState(null);
      const [followedArtists, setFollowedArtists] = useState([]);
      const [likedTracks, setLikedTracks] = useState([]);
      const engineRef = useRef(null);

      const getEngine = () => {
        if (!engineRef.current) {
          engineRef.current = new SynthwaveEngine(currentTrack.bpm, currentTrack.duration);
        }
        return engineRef.current;
      };

      useEffect(() => {
        if (engineRef.current) engineRef.current.stop();
        engineRef.current = new SynthwaveEngine(currentTrack.bpm, currentTrack.duration);
        engineRef.current.registerCallbacks(
          (step) => {},
          (time) => { setPlayerState(prev => ({ ...prev, currentTime: Math.min(time, currentTrack.duration) })); }
        );
        engineRef.current.setVolume(playerState.isMuted ? 0 : playerState.volume);
        if (playerState.isPlaying) { engineRef.current.start(0); } 
        else { setPlayerState(prev => ({ ...prev, currentTime: 0 })); }
        setSelectedComment(null);
        return () => { if (engineRef.current) engineRef.current.stop(); };
      }, [currentTrack.id]);

      useEffect(() => {
        const engine = getEngine();
        if (playerState.isMuted) engine.setVolume(0);
        else engine.setVolume(playerState.volume);
      }, [playerState.volume, playerState.isMuted]);

      const handlePlayPause = () => {
        const engine = getEngine();
        const nextPlaying = !playerState.isPlaying;
        if (nextPlaying) engine.start(playerState.currentTime);
        else engine.stop();
        setPlayerState(prev => ({ ...prev, isPlaying: nextPlaying }));
      };

      const handleSeek = (targetTime) => {
        const engine = getEngine();
        engine.setTime(targetTime);
        setPlayerState(prev => ({ ...prev, currentTime: targetTime }));
        setSelectedComment(null);
      };

      const handleSkip = (direction) => {
        const currentIndex = TRACKS.findIndex(t => t.id === currentTrack.id);
        let nextIndex = currentIndex;
        if (playerState.isShuffled) {
          do { nextIndex = Math.floor(Math.random() * TRACKS.length); } while (nextIndex === currentIndex && TRACKS.length > 1);
        } else {
          if (direction === 'next') nextIndex = (currentIndex + 1) % TRACKS.length;
          else nextIndex = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
        }
        setCurrentTrack(TRACKS[nextIndex]);
      };

      const handleVolumeToggle = () => setPlayerState(prev => ({ ...prev, isMuted: !prev.isMuted }));

      const handleAddComment = (text, time) => {
        const newComment = {
          id: `comment-custom-${Date.now()}`,
          trackId: currentTrack.id,
          name: 'You (Listener)',
          text,
          time,
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80',
          type: activeFilter,
          timestampText: formatTime(time),
          likes: 1,
          likedByCurrentUser: true,
        };
        setComments(prev => [newComment, ...prev]);
        setSelectedComment(newComment);
      };

      const handleLikeComment = (commentId) => {
        setComments(prev => prev.map(c => {
          if (c.id === commentId) {
            const liked = !c.likedByCurrentUser;
            return { ...c, likes: liked ? c.likes + 1 : c.likes - 1, likedByCurrentUser: liked };
          }
          return c;
        }));
        if (selectedComment && selectedComment.id === commentId) {
          setSelectedComment(prev => {
            if (!prev) return null;
            const liked = !prev.likedByCurrentUser;
            return { ...prev, likes: liked ? prev.likes + 1 : prev.likes - 1, likedByCurrentUser: liked };
          });
        }
      };

      const toggleFollow = (artist) => setFollowedArtists(prev => prev.includes(artist) ? prev.filter(a => a !== artist) : [...prev, artist]);

      const toggleLikeTrack = (trackId) => {
        if (likedTracks.includes(trackId)) {
          setLikedTracks(prev => prev.filter(tid => tid !== trackId));
        } else {
          setLikedTracks(prev => [...prev, trackId]);
        }
      };

      const filteredTracks = useMemo(() => {
        return TRACKS.filter(t => {
          const matchQuery = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || t.artist.toLowerCase().includes(searchQuery.toLowerCase());
          const matchGenre = selectedGenre ? t.genre.toLowerCase().includes(selectedGenre.toLowerCase()) : true;
          return matchQuery && matchGenre;
        });
      }, [searchQuery, selectedGenre]);

      const socialFeed = useMemo(() => {
        return comments.map(c => {
          const associatedTrack = TRACKS.find(t => t.id === c.trackId) || TRACKS[0];
          return { ...c, track: associatedTrack };
        }).sort((a, b) => b.likes - a.likes);
      }, [comments]);

      const tabIndicatorLeft = activeFilter === 'artist' ? '0px' : activeFilter === 'top' ? '146px' : '290px';
      const tabIndicatorWidth = activeFilter === 'artist' ? '122px' : activeFilter === 'top' ? '120px' : '90px';

      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-neutral-50 text-neutral-900 flex flex-col relative font-sans border-x border-neutral-100 shadow-xl" style={{ paddingBottom: '64px', overflowX: 'hidden' }}>
          {/* Header */}
          <header className="sticky top-0 bg-white flex justify-between items-center px-4 h-16 z-40 border-b border-neutral-100 animate-fade-in" style={{ backdropFilter: 'blur(12px)' }}>
            <button
              onClick={() => { if (activeTab !== 'library') setActiveTab('library'); else handleSeek(0); }}
              className="p-2 hover:bg-neutral-50 rounded-xl cursor-pointer transition-colors active:scale-95"
            >
              <LucideIcon name="ArrowLeft" size={20} color="#404040" />
            </button>
            <h1 className="font-bold text-sm text-neutral-800 tracking-tight">
              {activeTab === 'library' && 'Now Playing'}
              {activeTab === 'home' && 'Discover Pulse'}
              {activeTab === 'feed' && 'Stream Feed'}
              {activeTab === 'search' && 'Search Library'}
            </h1>
            <button onClick={() => setIsPlaylistOpen(true)} className="p-2 hover:bg-neutral-50 rounded-xl cursor-pointer transition-colors active:scale-95">
              <LucideIcon name="MoreVertical" size={20} color="#404040" />
            </button>
          </header>

          {/* Main Content */}
          <main className="flex-1 px-4 flex flex-col pt-4 overflow-y-auto pb-4">
            <div key={activeTab} className="flex flex-col flex-1 tab-enter">

              {/* ── LIBRARY TAB ── */}
              {activeTab === 'library' && (
                <div className="flex flex-col flex-1">
                  {/* Album art */}
                  <section className="relative w-full rounded-2xl overflow-hidden border border-neutral-200 shadow-md group select-none" style={{ aspectRatio: '1/1' }}>
                    <img alt="Album Art" className="w-full h-full object-cover transition-transform duration-700" src={currentTrack.albumArt} referrerPolicy="no-referrer" style={{ groupHover: 'scale(1.05)' }} />
                    <div className="absolute inset-x-0 bottom-0 p-4 flex flex-col justify-end" style={{ background: 'linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.4), transparent)' }}>
                      {playerState.isPlaying && (
                        <div className="flex gap-1.5 items-end h-8 overflow-hidden opacity-90 mb-1">
                          {Array.from({ length: 40 }).map((_, idx) => (
                            <div key={`viz-${idx}`} className="rounded-t-sm" style={{ width: '3px', backgroundColor: '#ff5500', height: `${15 + (Math.sin(idx * 0.4) * 8) + (Math.random() * 12)}px`, animation: 'pulse 1s ease-in-out infinite', animationDelay: `${(idx * 0.08) % 1.2}s` }} />
                          ))}
                        </div>
                      )}
                      <div className="flex items-center gap-1.5">
                        <span className="text-white font-mono uppercase tracking-wider font-bold rounded-full" style={{ fontSize: '10px', backgroundColor: '#ff5500', padding: '2px 8px' }}>{currentTrack.genre}</span>
                        <span className="font-mono text-neutral-300" style={{ fontSize: '10px' }}>{currentTrack.bpm} BPM</span>
                      </div>
                    </div>
                  </section>

                  {/* Title row */}
                  <section className="flex justify-between items-start mt-5 mb-4 text-left">
                    <div className="flex-1 pr-4">
                      <h2 className="font-bold text-xl text-neutral-900 tracking-tight leading-tight uppercase">{currentTrack.title}</h2>
                      <p className="text-sm font-medium text-neutral-500 mt-0.5">{currentTrack.artist}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => toggleFollow(currentTrack.artist)}
                        className="text-xs font-semibold px-2.5 py-1 rounded-lg cursor-pointer transition-all flex items-center gap-1"
                        style={{
                          backgroundColor: followedArtists.includes(currentTrack.artist) ? '#f5f5f5' : '#fff7f5',
                          color: followedArtists.includes(currentTrack.artist) ? '#525252' : '#ff5500',
                          border: `1px solid ${followedArtists.includes(currentTrack.artist) ? '#e5e5e5' : '#ffe4d6'}`,
                          fontSize: '10px'
                        }}
                      >
                        <LucideIcon name={followedArtists.includes(currentTrack.artist) ? 'UserCheck' : 'UserPlus'} size={12} color={followedArtists.includes(currentTrack.artist) ? '#525252' : '#ff5500'} />
                        {followedArtists.includes(currentTrack.artist) ? 'Joined' : 'Join'}
                      </button>
                      <button onClick={() => toggleLikeTrack(currentTrack.id)} className="p-2 hover:bg-neutral-100 rounded-xl cursor-pointer transition-colors active:scale-90">
                        <LucideIcon name="Heart" size={20} className={likedTracks.includes(currentTrack.id) ? 'fill-current' : ''} color={likedTracks.includes(currentTrack.id) ? '#ff5500' : '#737373'} />
                      </button>
                    </div>
                  </section>

                  {/* Comment filter tabs */}
                  <section className="relative mb-5">
                    <div className="flex gap-8 border-b border-neutral-100 pb-2 relative select-none">
                      {[['artist', 'ARTIST COMMENTARY'], ['top', 'POPULAR FEEDBACKS'], ['friends', 'FRIEND SITES']].map(([key, label]) => (
                        <button key={key} onClick={() => { setActiveFilter(key); setSelectedComment(null); }}
                          className="font-semibold tracking-wider transition-colors py-1 cursor-pointer"
                          style={{ fontSize: '10px', color: activeFilter === key ? '#ff5500' : '#a3a3a3' }}
                        >{label}</button>
                      ))}
                    </div>
                    <div className="absolute bottom-0 h-0.5 transition-all duration-300" style={{ left: tabIndicatorLeft, width: tabIndicatorWidth, backgroundColor: '#ff5500' }} />
                  </section>

                  {/* Waveform */}
                  <Waveform track={currentTrack} currentTime={playerState.currentTime} comments={comments} activeFilter={activeFilter} onSeek={handleSeek} onSelectComment={setSelectedComment} selectedComment={selectedComment} />

                  {/* Playback controls */}
                  <section className="bg-white border border-neutral-100 p-4 rounded-2xl flex flex-col items-center shadow-sm">
                    <div className="flex justify-between w-full font-semibold font-mono text-neutral-400 select-none px-1 mb-2.5" style={{ fontSize: '12px' }}>
                      <span>{formatTime(playerState.currentTime)}</span>
                      <span>{formatTime(currentTrack.duration)}</span>
                    </div>
                    <div className="flex items-center justify-between w-full" style={{ maxWidth: '320px' }}>
                      <button onClick={() => setPlayerState(prev => ({ ...prev, isShuffled: !prev.isShuffled }))} className="cursor-pointer p-2 rounded-lg transition-colors" style={{ color: playerState.isShuffled ? '#ff5500' : '#a3a3a3', backgroundColor: playerState.isShuffled ? '#fff7f5' : 'transparent' }}>
                        <LucideIcon name="Shuffle" size={20} />
                      </button>
                      <button onClick={() => handleSkip('prev')} className="cursor-pointer p-2 rounded-lg transition-colors text-neutral-700 hover:text-brand-orange">
                        <LucideIcon name="SkipBack" size={24} />
                      </button>
                      <button onClick={handlePlayPause} className="text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform cursor-pointer" style={{ width: '64px', height: '64px', backgroundColor: '#ff5500' }}>
                        <LucideIcon name={playerState.isPlaying ? 'Pause' : 'Play'} size={32} color="white" />
                      </button>
                      <button onClick={() => handleSkip('next')} className="cursor-pointer p-2 rounded-lg transition-colors text-neutral-700">
                        <LucideIcon name="SkipForward" size={24} />
                      </button>
                      <button onClick={() => setPlayerState(prev => ({ ...prev, isLooping: !prev.isLooping }))} className="cursor-pointer p-2 rounded-lg transition-colors" style={{ color: playerState.isLooping ? '#ff5500' : '#a3a3a3', backgroundColor: playerState.isLooping ? '#fff7f5' : 'transparent' }}>
                        <LucideIcon name="Repeat" size={20} />
                      </button>
                    </div>
                    {/* Volume */}
                    <div className="flex gap-2.5 items-center w-full mt-3 px-2">
                      <button onClick={handleVolumeToggle} className="text-neutral-400 hover:text-neutral-600 cursor-pointer">
                        <LucideIcon name={playerState.isMuted || playerState.volume === 0 ? 'VolumeX' : 'Volume2'} size={16} />
                      </button>
                      <input type="range" min="0" max="1" step="0.05" value={playerState.isMuted ? 0 : playerState.volume}
                        onChange={(e) => { const vol = parseFloat(e.target.value); setPlayerState(prev => ({ ...prev, volume: vol, isMuted: vol === 0 })); }}
                        className="flex-1 accent-brand-orange rounded-lg cursor-pointer appearance-none outline-none"
                        style={{ height: '4px', backgroundColor: '#e5e7eb' }}
                      />
                      <span className="font-mono text-neutral-400" style={{ fontSize: '10px', width: '24px' }}>
                        {playerState.isMuted ? '0%' : `${Math.floor(playerState.volume * 100)}%`}
                      </span>
                    </div>
                  </section>

                  {/* Comments panel */}
                  <CommentsPanel track={currentTrack} currentTime={playerState.currentTime} comments={comments} activeFilter={activeFilter} onAddComment={handleAddComment} onLikeComment={handleLikeComment} onSelectComment={setSelectedComment} />
                </div>
              )}

              {/* ── HOME TAB ── */}
              {activeTab === 'home' && (
                <div className="flex flex-col flex-1 gap-5 text-left">
                  {/* Hero */}
                  <section className="rounded-2xl p-5 text-white shadow-md relative overflow-hidden" style={{ background: 'linear-gradient(135deg, #ea580c, #f59e0b)' }}>
                    <div className="absolute right-0 bottom-0 top-0 w-1/3 opacity-10 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#fff 1px, transparent 1px)', backgroundSize: '16px 16px' }} />
                    <div className="relative z-10">
                      <div className="inline-flex items-center gap-1.5 rounded-md font-bold font-mono uppercase tracking-wider mb-2" style={{ backgroundColor: 'rgba(255,255,255,0.25)', fontSize: '9px', padding: '2px 8px' }}>
                        <LucideIcon name="Radio" size={12} color="white" /> Now Streaming Live
                      </div>
                      <h3 className="text-xl font-bold tracking-tight">Synthwave Horizon Lounge</h3>
                      <p className="mt-1 leading-relaxed" style={{ fontSize: '12px', color: 'rgba(255,241,210,0.8)', maxWidth: '260px' }}>Dive into procedurally synthesized neon loops and connect with creators over precise timestamps.</p>
                    </div>
                  </section>

                  {/* Stations */}
                  <section>
                    <h3 className="font-bold text-sm text-neutral-800 uppercase tracking-wider mb-3 flex items-center gap-2">
                      <LucideIcon name="Compass" size={16} color="#ff5500" /> Explore Stations
                    </h3>
                    <div className="space-y-3">
                      {TRACKS.map(t => (
                        <div key={t.id} onClick={() => { setCurrentTrack(t); setActiveTab('library'); }}
                          className="flex gap-3 p-3 rounded-xl border transition-all cursor-pointer bg-white items-center hover:border-neutral-300"
                          style={{ borderColor: t.id === currentTrack.id ? '#ff5500' : '#f3f4f6', boxShadow: t.id === currentTrack.id ? '0 0 0 1px rgba(255,85,0,0.2)' : 'none' }}
                        >
                          <img src={t.albumArt} alt={t.title} referrerPolicy="no-referrer" className="rounded-lg object-cover" style={{ width: '48px', height: '48px' }} />
                          <div className="flex-1 min-w-0">
                            <h4 className="font-bold text-xs text-neutral-800 truncate">{t.title}</h4>
                            <p className="text-neutral-500 mt-0.5 truncate" style={{ fontSize: '10px' }}>By {t.artist}</p>
                            <div className="flex gap-2 mt-1.5 items-center">
                              <span className="text-neutral-400 bg-neutral-100 rounded px-1.5" style={{ fontSize: '9px' }}>{t.genre}</span>
                              <span className="text-neutral-400 font-mono" style={{ fontSize: '9px' }}>{t.bpm} BPM</span>
                            </div>
                          </div>
                          <span className="font-bold flex items-center gap-1 rounded-lg" style={{ fontSize: '10px', color: '#ff5500', backgroundColor: '#fff7f5', padding: '2px 8px' }}>
                            <LucideIcon name="TrendingUp" size={12} color="#ff5500" />{((t.plays / 1000) * 0.12).toFixed(1)}k live
                          </span>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* Artists */}
                  <section>
                    <h3 className="font-bold text-sm text-neutral-800 uppercase tracking-wider mb-2.5">Followed Synth Artists</h3>
                    <div className="flex gap-4 overflow-x-auto py-1 select-none">
                      {[...new Set(TRACKS.map(t => t.artist))].map(artist => {
                        const isFollowed = followedArtists.includes(artist);
                        const artwork = TRACKS.find(t => t.artist === artist)?.albumArt || TRACKS[0].albumArt;
                        return (
                          <div key={artist} className="flex flex-col items-center flex-shrink-0 bg-white border border-neutral-100 rounded-xl p-2.5 shadow-sm" style={{ width: '96px' }}>
                            <img src={artwork} alt={artist} referrerPolicy="no-referrer" className="rounded-full object-cover border border-neutral-200" style={{ width: '48px', height: '48px' }} />
                            <span className="font-bold text-neutral-800 mt-1.5 truncate max-w-full text-center" style={{ fontSize: '10px' }}>{artist}</span>
                            <button onClick={() => toggleFollow(artist)} className="mt-2 font-semibold w-full py-0.5 rounded transition-all"
                              style={{ fontSize: '9px', backgroundColor: isFollowed ? '#f5f5f5' : '#ff5500', color: isFollowed ? '#525252' : 'white', border: isFollowed ? '1px solid #e5e5e5' : 'none' }}
                            >{isFollowed ? 'Joined' : 'Join'}</button>
                          </div>
                        );
                      })}
                    </div>
                  </section>
                </div>
              )}

              {/* ── FEED TAB ── */}
              {activeTab === 'feed' && (
                <div className="flex flex-col flex-1 gap-4 text-left">
                  <div className="flex justify-between items-baseline mb-1">
                    <h3 className="font-bold text-sm text-neutral-800 uppercase tracking-wider flex items-center gap-2">
                      <LucideIcon name="Rss" size={16} color="#ff5500" /> Live Platform Feedback Activity
                    </h3>
                  </div>
                  <div className="space-y-3">
                    {socialFeed.map(f => (
                      <div key={f.id}
                        onClick={() => { const t = TRACKS.find(tr => tr.id === f.trackId) || TRACKS[0]; setCurrentTrack(t); setActiveTab('library'); setTimeout(() => { handleSeek(f.time); setSelectedComment(f); }, 250); }}
                        className="bg-white border border-neutral-100 rounded-xl p-3 cursor-pointer hover:border-neutral-300 transition-all flex flex-col gap-2"
                      >
                        <div className="flex items-center gap-2">
                          <img src={f.avatar} alt={f.name} referrerPolicy="no-referrer" className="rounded-full border border-neutral-200 object-cover" style={{ width: '32px', height: '32px' }} />
                          <div className="flex-1 min-w-0">
                            <h4 className="font-bold text-xs text-neutral-800 truncate">{f.name}</h4>
                            <p className="text-neutral-400 font-mono" style={{ fontSize: '9px' }}>Commented on track</p>
                          </div>
                          <span className="font-mono font-bold rounded" style={{ fontSize: '10px', color: '#ff5500', backgroundColor: '#fff7f5', padding: '2px 6px' }}>At {f.timestampText}</span>
                        </div>
                        <p className="text-xs text-neutral-600 bg-neutral-50 rounded-lg p-2.5 italic text-left">"{f.text}"</p>
                        <div className="flex items-center gap-2 border-t border-neutral-100 pt-2">
                          <img src={f.track.albumArt} alt={f.track.title} referrerPolicy="no-referrer" className="rounded object-cover" style={{ width: '32px', height: '32px' }} />
                          <div className="flex-1 min-w-0 text-left">
                            <p className="font-semibold text-xs text-neutral-800 truncate">{f.track.title}</p>
                            <p className="text-neutral-500 truncate" style={{ fontSize: '9px' }}>By {f.track.artist} (Station)</p>
                          </div>
                          <button onClick={(e) => { e.stopPropagation(); handleLikeComment(f.id); }}
                            className="flex items-center gap-1.5 rounded-lg transition-colors"
                            style={{ fontSize: '10px', padding: '4px 8px', color: f.likedByCurrentUser ? '#ff5500' : '#a3a3a3', backgroundColor: f.likedByCurrentUser ? '#fff7f5' : '#f5f5f5' }}
                          >
                            <LucideIcon name="Heart" size={14} className="fill-current" color={f.likedByCurrentUser ? '#ff5500' : '#a3a3a3'} />
                            {f.likes}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ── SEARCH TAB ── */}
              {activeTab === 'search' && (
                <div className="flex flex-col flex-1 gap-4 text-left">
                  <section className="relative">
                    <span className="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"><LucideIcon name="Search" size={16} color="#a3a3a3" /></span>
                    <input type="text" placeholder="Find tracks, artists, stations..." value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full text-xs p-3 bg-white text-neutral-800 rounded-xl border border-neutral-200 outline-none transition-colors"
                      style={{ paddingLeft: '40px', focusBorderColor: '#ff5500' }}
                      onFocus={e => e.target.style.borderColor = '#ff5500'}
                      onBlur={e => e.target.style.borderColor = '#e5e7eb'}
                    />
                    {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-600 cursor-pointer text-xs">Clear</button>}
                  </section>
                  <section>
                    <h4 className="font-bold tracking-wider text-neutral-400 uppercase mb-2 select-none" style={{ fontSize: '10px' }}>Quick Genre Filter</h4>
                    <div className="flex gap-2 flex-wrap">
                      {['Synthwave', 'Outrun', 'Dreamwave', 'Cyberpunk', 'Synth-Pop'].map(genre => (
                        <button key={genre} onClick={() => setSelectedGenre(selectedGenre === genre ? null : genre)}
                          className="text-xs px-3 py-1.5 rounded-full cursor-pointer transition-all border"
                          style={{ backgroundColor: selectedGenre === genre ? '#ff5500' : 'white', color: selectedGenre === genre ? 'white' : '#525252', borderColor: selectedGenre === genre ? '#ff5500' : '#e5e7eb' }}
                        >{genre}</button>
                      ))}
                    </div>
                  </section>
                  <section className="flex-1 mt-1">
                    <div className="flex justify-between items-baseline mb-2.5 text-left">
                      <h4 className="font-bold text-xs text-neutral-800 uppercase tracking-wider select-none">Matches Found ({filteredTracks.length})</h4>
                      {selectedGenre && <button onClick={() => setSelectedGenre(null)} className="cursor-pointer" style={{ fontSize: '10px', color: '#ff5500' }}>Clear Genre Filter</button>}
                    </div>
                    {filteredTracks.length === 0 ? (
                      <div className="bg-white border border-neutral-100 rounded-xl py-12 text-center">
                        <LucideIcon name="Compass" size={32} color="#d4d4d4" />
                        <p className="text-xs text-neutral-500 font-semibold mt-2">No stations found matching filters</p>
                        <p className="text-neutral-400 mt-1" style={{ fontSize: '10px', maxWidth: '200px', margin: '4px auto 0', lineHeight: '1.5' }}>Try typing a different keyword or tapping some other quick genre bubble above.</p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        {filteredTracks.map(t => (
                          <div key={t.id} onClick={() => { setCurrentTrack(t); setActiveTab('library'); }}
                            className="flex gap-3 p-3 bg-white border border-neutral-100 rounded-xl hover:border-neutral-300 transition-all cursor-pointer items-center text-left"
                          >
                            <img src={t.albumArt} alt={t.title} referrerPolicy="no-referrer" className="rounded-lg object-cover" style={{ width: '48px', height: '48px' }} />
                            <div className="flex-1 min-w-0">
                              <h4 className="font-bold text-xs text-neutral-800 truncate">{t.title}</h4>
                              <p className="text-neutral-500 mt-0.5 truncate" style={{ fontSize: '10px' }}>{t.artist}</p>
                              <span className="inline-block font-semibold rounded mt-1.5" style={{ fontSize: '9px', color: '#ff5500', backgroundColor: '#fff7f5', padding: '2px 8px' }}>{t.genre}</span>
                            </div>
                            <LucideIcon name="Play" size={16} color="#a3a3a3" />
                          </div>
                        ))}
                      </div>
                    )}
                  </section>
                </div>
              )}
            </div>
          </main>

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 max-w-md w-full z-40 flex justify-around items-center bg-white border-t border-neutral-100 select-none" style={{ height: '64px', boxShadow: '0 -2px 12px rgba(0,0,0,0.02)' }}>
            {[
              ['home', 'Home', 'Home'],
              ['feed', 'Feed', 'Rss'],
              ['search', 'Search', 'Search'],
              ['library', 'Library', 'Library'],
            ].map(([tab, label, icon]) => (
              <button key={tab} onClick={() => { setActiveTab(tab); setSelectedComment(null); }}
                className="flex flex-col items-center justify-center flex-1 h-full cursor-pointer transition-all active:scale-90"
                style={{ color: activeTab === tab ? '#ff5500' : '#a3a3a3', fontWeight: activeTab === tab ? '700' : '400' }}
              >
                <LucideIcon name={icon} size={20} color={activeTab === tab ? '#ff5500' : '#a3a3a3'} />
                <span className="mt-0.5" style={{ fontSize: '11px', fontWeight: 'inherit' }}>{label}</span>
              </button>
            ))}
          </nav>

          {/* Playlist Drawer */}
          <PlaylistDrawer tracks={TRACKS} currentTrack={currentTrack} onSelectTrack={setCurrentTrack} isOpen={isPlaylistOpen} onClose={() => setIsPlaylistOpen(false)} />
        </div>
      );
    }

    // ─── Mount ───────────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
